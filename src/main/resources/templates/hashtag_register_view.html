<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>해시태그 조합하기</title>
</head>
<body>

<div class="section">
    <h2>신규 해시태그 등록</h2>
    <p>기존에 등록되어 있지 않은 새로운 태그를 추가합니다.</p>

    <form th:action="@{/hashtags/save}" method="post">
        <input type="text" name="hashtagName" placeholder="태그 이름" required>

        <select name="category" required>
            <option value="" disabled selected>카테고리 선택</option>
            <option value="ROLE">ROLE (역할)</option>
            <option value="TIME">TIME (시간)</option>
            <option value="PLACE">PLACE (장소)</option>
            <option value="SITUATION">SITUATION (상황)</option>
            <option value="RELATION">RELATION (관계)</option>
            <option value="TONE">TONE (말투)</option>
            <option value="EMOTION">EMOTION (감정)</option>
        </select>

        <button type="submit">태그 추가</button>
    </form>
</div>

</body>
</html>
