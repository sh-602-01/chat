<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 - 유저 목록</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<h2>유저 관리 목록</h2>
<a th:href="@{/admin/users/save}">신규 유저 등록</a>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>아이디</th>
        <th>이름</th>
        <th>근무시간</th>
        <th>관리</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}" th:id="'user-row-' + ${user.id}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.userId}"></td>
        <td th:text="${user.userName}"></td>
        <td>
            <span th:text="${user.workStartTime}"></span> ~
            <span th:text="${user.workEndTime}"></span>
        </td>
        <td>
            <button th:onclick="'deleteUser(' + ${user.id} + ')'">삭제</button>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(users)}">
        <td colspan="5">등록된 유저가 없습니다.</td>
    </tr>
    </tbody>
</table>

<script>
    function deleteUser(id) {
        if (confirm("정말 이 유저를 삭제하시겠습니까?")) {
            $.ajax({
                url: '/admin/users/' + id,
                type: 'DELETE',
                success: function(result) {
                    if (result === "ok") {
                        alert("삭제되었습니다.");
                        $("#user-row-" + id).remove();
                    }
                },
                error: function() {
                    alert("삭제 실패!");
                }
            });
        }
    }
</script>
</body>
</html>
