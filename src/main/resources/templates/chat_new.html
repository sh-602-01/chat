<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>말랑말랑- AI 실시간 채팅 보정</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
    <link rel="stylesheet" href="/css/chat.css">
</head>
<body>
    <div class="external-side-nav">
        <button class="ai-action-btn" title="설정" onclick="openModal()">
            <svg viewBox="0 0 24 24">
                <path
                        d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.21.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z">
                </path>
            </svg>
        </button>
        <button class="ai-action-btn" title="검색">
            <svg viewBox="0 0 24 24">
                <path
                        d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z">
                </path>
            </svg>
        </button>
    </div>
    <div class="device-frame">
        <input type="hidden" id="room_id" th:value="${roomId != null ? roomId : 1}">
        <input type="hidden" id="sender_id" th:value="${session.loginUser.id}">
        <input type="hidden"  id="user_id" th:value="${session.loginUser.userId}">
        <header class="header">
            <span class="user-name" th:text="${roomName}"></span>
        </header>

        <main class="chat-area" id="chat">

        </main>

        <div class="ai-card" id="refineCard" onclick="sendMsg()">
            <span class="close-x" onclick="closeCard(event)">×</span>
            <span class="ai-card-title">✨ 말랑말랑 AI 보정 제안</span>
            <div class="ai-text" id="aiPreview">잠시만요, 곧 정리해서 보내드릴게요!</div>
        </div>

        <footer class="input-bar">
            <div class="input-wrapper">
                <input type="text" id="chatInput" placeholder="메시지를 입력하세요...">
            </div>
            <button class="btn-v" style="width:40px; height:40px;" onclick="openRefine()">
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </footer>


    </div>
</body>
<script src="/js/chat.js"></script>
<script>

    const aiPreview = document.getElementById('aiPreview');
    const refineCard = document.getElementById('refineCard');
    function openRefine() {
        const val = chatInput.value.trim();
        if (!val) return;
        //const suffix = selectedTags.includes("부드럽게") ? " 😊" : "!";
        aiPreview.innerText = `[보정됨]  ${val} `;
        refineCard.style.display = 'block';
    }
    function closeCard(e){
        e.stopPropagation();
        refineCard.style.display = 'none';
    }
</script>
</html>
