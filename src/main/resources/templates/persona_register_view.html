<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="/css/common.css" rel="stylesheet">
    <link href="/css/persona.css" rel="stylesheet">
</head>
<body>
<div class="persona-wrapper">
    <div class="pc-container">
        <div class="header">
            <h2 th:text="${persona != null ? '말랑이 반죽하기' : '말랑이 만들기'}"></h2>
        </div>

        <input type="hidden" id="personaId" th:value="${persona?.personaId}">

        <div class="tag-grid">
            <div class="tag-section" th:each="category : ${categories}">
                <span class="tag-title" th:text="${category.value}"></span>
                <div class="tag-container" th:classappend="${category.key}">
                    <th:block th:each="tag : ${hashtags}">
                        <th:block th:if="${tag.category != null and tag.category.name().equalsIgnoreCase(category.key)}">
                            <input type="checkbox"
                                   name="hashtagIds"
                                   th:value="${tag.hashtagId}"
                                   th:id="'tag' + ${tag.hashtagId}"
                                   th:checked="${selectedTagIds != null and selectedTagIds.contains(tag.hashtagId)}">
                            <label class="tag-label" th:for="'tag' + ${tag.hashtagId}" th:text="${tag.hashtagName}"></label>
                        </th:block>
                    </th:block>
                </div>
            </div>
        </div>

        <div class="footer-action">
            <input type="text" id="personaName" class="name-input"
                   th:value="${persona?.personaName}" placeholder="말랑이 이름을 입력하세요" required>
            <button type="button" class="submit-tags" onclick="savePersona()">이 말랑이 사용</button>
        </div>
    </div>
</div>
<div id="finalSelectionScreen"></div>
<script>
    // const checkboxes = document.querySelectorAll('input[type="checkbox"]');
    // const countText = document.getElementById('countText');
    //
    // checkboxes.forEach(cb => {
    //     cb.addEventListener('change', () => {
    //         const count = document.querySelectorAll('input[type="checkbox"]:checked').length;
    //         countText.innerText = `선택된 태그: ${count}개`;
    //     });
    // });

    async function savePersona() {
        const personaId = document.getElementById('personaId').value;
        const personaName = document.getElementById('personaName').value;

        // 체크된 태그 ID 배열로 수집
        const hashtagIds = Array.from(document.querySelectorAll('input[name="hashtagIds"]:checked'))
            .map(cb => parseInt(cb.value));

        if (!personaName) {
            alert("페르소나 이름을 입력해주세요.");
            return;
        }

        const data = {
            personaName: personaName,
            hashtagIds: hashtagIds,
            systemPrompt: "기본 시스템 프롬프트" // 필요시 입력창 만들어 연동
        };

        // ID가 있으면 PUT(수정), 없으면 POST(등록)
        const isUpdate = personaId !== "";
        const url = isUpdate ? `/persona/${personaId}` : '/persona_tags/create';
        const method = isUpdate ? 'PUT' : 'POST';

        try {
            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                alert(isUpdate ? "수정되었습니다." : "등록되었습니다.");
                location.href = "/persona_tags/view";
            } else {
                alert("처리 중 오류가 발생했습니다.");
            }
        } catch (error) {
            console.error("Error:", error);
            alert("서버 통신 오류");
        }
    }

</script>
</body>

</html>
