<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>채팅방 목록</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-4">

    <h3 class="mb-4">채팅방 목록</h3>

    <div class="mb-3">
        <a href="/create_room" class="btn btn-success">채팅방 생성</a>
    </div>

    <!-- 채팅방 리스트 -->
    <div class="row-6 mb20" th:each="room : ${rooms}" style="margin-bottom:15px;">
        <div class="card">
            <div class="card-header">
                방 ID: <span th:text="${room.roomId}"></span>
            </div>
            <div class="card-body">
                <h5 class="card-title" th:text="${room.roomName}"></h5>

                <p class="card-text">
                    방 타입: <span th:text="${room.roomType}"></span>
                </p>

                <a th:href="@{/chat/{id}(id=${room.roomId})}" class="btn btn-primary">
                    입장하기
                </a>
            </div>
        </div>
    </div>

</div>

</body>
</html>
