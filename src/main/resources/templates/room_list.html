<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>채팅방 목록</title>
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/room_list.css">
</head>
<body>
<div class="phone">
    <div class="card">

        <!-- 채팅방 리스트 -->
        <div class="chat-list">
            <div class="chat-list-header">
                <h4>채팅방 목록</h4>
            </div>
            <div class="chat-content" th:each="room: ${rooms}">
                <div class="chat-text">
                    <span class="chat-name" th:text="${room.roomName}"></span>
                    <a th:href="@{/chat/{id}(id=${room.roomId})}" class="btn btn-primary">입장하기</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
