<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>페르소나 태그 리스트</title>
</head>
<body>

<h1>나의 페르소나 리스트</h1>

<div th:each="item : ${personaWithTagsList}" class="section">

    <h2 th:text="'페르소나: ' + ${item.personas.personaName}">페르소나 이름</h2>

    <h3>연결된 태그</h3>

    <div th:if="${#lists.size(item.tags) > 0}">
        <ul class="tag-list">
            <li th:each="tag : ${item.tags}"
                th:text="|${tag.hashtags.hashtagName} (${tag.hashtags.category})|">
                태그명 (카테고리)
            </li>
        </ul>
    </div>

    <div th:if="${#lists.size(item.tags) == 0}">
        <p>등록된 태그가 없습니다.</p>
    </div>
</div>

<div th:if="${#lists.isEmpty(personaWithTagsList)}">
    <p>등록된 페르소나가 없습니다. 먼저 페르소나를 등록해 주세요!</p>
</div>

</body>
</html>
