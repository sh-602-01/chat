<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>채팅</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
    <style>
        #chat{
            padding:0;
            max-width: 400px;
            background:#f1f1f1;
            height:100%;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        #chat li{
            display:inline-flex;
            list-style: none;
        }
        #chat li span{
            font-size:12px;
        }
        .my-msg {
            justify-content: flex-end;
            text-align: right;
            color: blue;
            background-color: #e0f7fa;
            margin: 5px;
            padding: 5px;
            border-radius: 10px;
        }
        .other-msg {
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-start;
            text-align: left;
            color: black;
            background-color: #f1f1f1;
            margin: 5px;
            padding: 5px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<!-- 방 번호와 로그인 정보 -->
<input type="hidden" id="room_id" th:value="${roomId != null ? roomId : 1}">
<input id="sender_id" th:value="${session.loginUser.id}" type="hidden">
<input id="name" th:value="${session.loginUser.username}">
<input id="message">
<button onclick="send()">전송</button>

<ul id="chat"></ul>

<script>
    let stompClient = null;
    let roomId = document.getElementById("room_id").value;
    function loadPreviousMessages() {

        fetch("/api/chat/" + roomId)  // REST API 호출
            .then(response => response.json())
            .then(messages => {
                messages.reverse().forEach(msg => showMessage(msg));
            })
            .catch(error => console.error('데이터 로딩 실패:', error));
    }

    function connect() {
        let socket = new SockJS("/ws-chat");
        stompClient = Stomp.over(socket);
        stompClient.connect({}, function(frame){
            //console.log('Connected: ' + frame);

            // 기존 메시지 불러오기
            loadPreviousMessages();

            // WebSocket 구독
            stompClient.subscribe("/topic/messages/" + roomId, function(message){
                //console.log("구독 경로: ", "/topic/messages/" + roomId)
                //console.log("서버에서 받은 데이터: ", message.body);
                showMessage(JSON.parse(message.body));
            });
        });
    }

    function send() {
        const senderId = document.getElementById("sender_id").value;
        const name = document.getElementById("name").value;
        const message = document.getElementById("message").value;

        stompClient.send("/app/sendMessage/" + roomId, {}, JSON.stringify({
            senderId: senderId,    // 서버 DTO 필드명과 똑같이!
            senderName: name,      // 서버 DTO 필드명과 똑같이!
            message: message
        }));

        document.getElementById("message").value = "";
    }

    function showMessage(message){
        //console.log(message)
        const chat = document.getElementById("chat");
        const li = document.createElement("li");
        const myId = Number(document.getElementById("sender_id").value);

        // JSON 데이터의 실제 키값(snake_case)에 맞게 수정
        const msgSenderId   = message.sender_id || message.senderId;
        const msgContent    = message.final_msg || message.message;
        const msgSenderName = message.sender_name || message.senderName || "알 수 없는 사용자";

        if (msgSenderId == myId) {
            li.className = "my-msg";
            li.innerText = "(나) " + msgContent;
        } else {
            li.className = "other-msg";
            const span = document.createElement("span");
            span.style.fontWeight = "bold";
            span.style.display = "block";
            span.innerText = msgSenderName || "알 수 없는 사용자";

            const p = document.createElement("p");
            p.style.margin = "5px 0 0 0";
            p.innerText = msgContent;

            li.appendChild(span);
            li.appendChild(p);
        }

        chat.appendChild(li);
        chat.scrollTop = chat.scrollHeight; // 새 메시지 오면 스크롤 하단으로
    }

    // 페이지 로드 시 연결
    connect();
</script>
</body>
</html>
