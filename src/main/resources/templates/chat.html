<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
    <style>
        #chat{
            padding:0;
            max-width: 400px;
            background:#f1f1f1;
            height:100%;
            display: flex;
            flex-direction: column;
        }
        #chat li{
            display:inline-flex;
            list-style: none;
        }
        #chat li span{
            font:12px;
        }
        .my-msg {
            justify-content: flex-end;
            text-align: right;
            color: blue;
            background-color: #e0f7fa;
            margin: 5px;
            padding: 5px;
            border-radius: 10px;
        }
        .other-msg {
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-start;
            text-align: left;
            color: black;
            background-color: #f1f1f1;
            margin: 5px;
            padding: 5px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <input id="sender_id" th:value="${session.loginUser.id}" type="hidden">
    <input id="name" th:value="${session.loginUser.username}">
    <input id="message">
    <button onclick="send()">전송</button>
    <ul id="chat"></ul>
    <script>
        function loadPreviousMessages() {
            // 우리가 컨트롤러에 만든 데이터 요청 주소
            fetch("/api/chat")
                .then(response => response.json())
                .then(messages => {
                    // 가져온 10개의 메시지를 순회하며 화면에 출력
                    // 만약 서버에서 최신순(역순)으로 왔다면 .reverse()로 순서를 맞출 수 있습니다.
                    messages.reverse().forEach(msg => {
                        showMessage(msg);
                    });
                })
                .catch(error => console.error('데이터 로딩 실패:', error));
        }

        let stompClient = null;
        function connect(){
            let socket = new SockJS("/chat");
            stompClient = Stomp.over(socket);
            stompClient.connect({}, function(frame){
                console.log('Connected: ' + frame);

                // 1. 소켓 연결 성공 후 기존 메시지 불러오기
                loadPreviousMessages();

                stompClient.subscribe("/topic/messages", function(message){
                    showMessage(JSON.parse(message.body));
                })
            });
        }
        function send(){
            let senderId = document.getElementById("sender_id").value;
            let name = document.getElementById("name").value;
            let message =document.getElementById("message").value;
            stompClient.send("/app/sendMessage",{}, JSON.stringify({senderId : senderId, sender:name, message:message}));
            document.getElementById("message").value = "";
        }
        function showMessage(message){
            let chat = document.getElementById("chat");
            let li = document.createElement("li");
            let myId = document.getElementById("sender_id").value;

            // 1. 데이터 필드 매핑 (DTO와 실시간 메시지 공통 처리)
            // 실시간 메시지는 .senderId, DB에서 온 데이터는 .sender_id 사용
            let msgSenderId = message.senderId || message.sender_id;
            // 실시간 메시지는 .message, DB에서 온 데이터는 .final_msg 사용
            let msgContent = message.message || message.final_msg;
            // 실시간 메시지는 .sender, DB 데이터는 이름이 없으므로 ID로 대체 (혹은 DTO에 이름 추가 필요)
            // 🔥 핵심 수정
            let msgSenderName = message.sender
                || message.sender_name
                || "사용자(" + msgSenderId + ")";

            if (msgSenderId == myId) {
                li.className = "my-msg";
                li.innerText = "(나) " + msgContent;
            } else {
                li.className = "other-msg";

                let span = document.createElement("span");
                span.style.fontWeight = "bold";
                span.style.display = "block";
                span.innerText = msgSenderName;

                let p = document.createElement("p");
                p.style.margin = "5px 0 0 0";
                p.innerText = msgContent;

                li.appendChild(span);
                li.appendChild(p);

            }

            chat.appendChild(li);
            // 메시지가 많아지면 자동으로 아래로 스크롤
            chat.scrollTop = chat.scrollHeight;
        }
        connect();
        console.log(message);
    </script>
</body>
</html>
