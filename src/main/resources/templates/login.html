<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
</head>
<body>
<div class="container">

  <div th:if="${param.error}">
    <p style="color:red;">로그인 실패! 회원가입을 진행해주세요.</p>
    <a href="/api/join" class="btn btn-success">회원가입</a>
  </div>
<!--  로그인 전 -->
  <div class="mb-4" th:if="${session.loginUser == null}">
    <h4>로그인</h4>
    <form action="/api/login_user" method="post">
      <div class="form-group">
        <label>아이디</label>
        <input type="text" name="userId" class="form-control">
      </div>
      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" name="password" class="form-control">
      </div>
      <button type="submit" class="btn btn-success">로그인</button>
    </form>
  </div>
  <!-- 로그인 후 -->
  <div th:if="${session.loginUser != null}">
    <p th:text="${session.loginUser.userName} + '님 환영합니다!'"></p>
    <a href="/api/logout" class="btn btn-danger">로그아웃</a>
    <a href="/room_list" class="btn btn-danger">채팅하기</a>
    <a href="/create_room" class="btn btn-danger">채팅방개설하기</a>
  </div>
</div>
</body>
</html>
