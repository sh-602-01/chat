<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="/css/common.css" rel="stylesheet">
    <link href="/css/login.css" rel="stylesheet">
</head>
<body>
<div class="container" th:if="${session.loginUser == null}">
    <div class="center-card" th:if="${param.error}">
        <div class="join-title">로그인 실패!</div>
        <div class="join-subtitle">회원가입을 진행해 주세요!</div>
        <div class="buttons">
            <a href="/api/join" class="btn-outline">회원가입</a>
        </div>
    </div>
    <div class="center-card" id="loginCard" th:unless="${param.error}">
        <div class="logo-area">
            <img src="/images/malrang.png" class="simbol_img" alt="로고">
        </div>
        <form action="/api/login_user" class="form-area" id="loginForm" method="post">
            <div class="input-group">
                <label for="userId">아이디 (ID)</label>
                <input type="text" id="userId" name="userId" placeholder="아이디를 입력하세요" required>
            </div>

            <div class="input-group">
                <label for="password">비밀번호 (Password)</label>
                <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
            </div>

            <button type="submit" class="submit-btn" id="loginBtn">
                <span id="btnText">로그인</span>
            </button>
            <a href="/api/join" class="join-btn">회원가입</a>
        </form>
    </div>
</div>
<div class="container" th:if="${session.loginUser != null}">
    <div class="phone">
        <div class="card">
            <div class="title" th:text="${session.loginUser.userName} + '님, 안녕하세요'"></div>
            <div class="subtitle">오늘도 기분 좋은 대화를 시작해보세요</div>
            <div class="divider"></div>
            <div class="buttons">
                <a href="/room_list" class="chat" id="chat-btn">채팅하기</a>
                <a href="/api/logout" class="logout">로그아웃</a>
                <div class="persona_btn_set">
                    <a href="/persona_tags/register" class="persona_pluse">
                        <img src="/images/User_profile_plus.svg" alt="">
                        <span>페르소나 생성</span>
                    </a>
                    <a href="/persona_tags/view" class="persona_my">
                        <img src="/images/User_profile_check.svg" alt="">
                        <span>내 페르소나</span>
                    </a>
                    <a href="#" onclick="openModal()" class="add_work">
                        <img src="/images/System_clock_ring_addTime.svg" alt="">
                        <span>근무시간 설정</span>
                    </a>
                </div>

            </div>

        </div>
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-card">
                <div class="modal-info">근무시간을  입력해 주세요.</div>
                <form id="worktime-form">
                    <div class="tag-input-wrapper">
                        <label for="workStartTime">출근시간</label>
                        <input type="text" id="workStartTime" placeholder="ex) 09:00">
                        <label for="workEndTime">퇴근시간</label>
                        <input type="text" id="workEndTime" placeholder="ex) 18:00">
                    </div>
                    <div class="btn-wrap">
                        <a href="#" onclick="closeModal()" class="action-btn btn-outline">닫기</a>
                        <button type="submit" class="action-btn btn-solid">근무시간 적용</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
    const modal = document.getElementById("modalOverlay");
    function openModal() {
        modal.style.display = 'flex';
    }

    function closeModal() {
        modal.style.display = 'none';
    }
    // 근무시간 저장 및 수정
    document.getElementById('worktime-form').addEventListener('submit', function(e) {
        e.preventDefault();

        const start = document.getElementById('workStartTime').value;
        const end = document.getElementById('workEndTime').value;

        fetch('/user/worktime', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ startTime: start, endTime: end })
        })
            .then(res => {
                if (res.ok) {
                    alert("근무시간이 설정되었습니다.");
                    closeModal();
                } else {
                    return res.text().then(msg => alert(msg));
                }
            })
            .catch(err => console.error(err));
    });

    // 기존 근무시간 불러오기
    window.addEventListener('DOMContentLoaded', function () {
        fetch('/user/worktime')
            .then(res => res.json())
            .then(data => {
                if (data.startTime) {
                    document.getElementById('workStartTime').value = data.startTime;
                }
                if (data.endTime) {
                    document.getElementById('workEndTime').value = data.endTime;
                }
            })
            .catch(err => console.error(err));
    });

    document.getElementById('chat-btn').addEventListener('click', function (e) {
        e.preventDefault(); // 1. 중요: 클릭 시 바로 이동하는 것을 방지!

        fetch('/user/worktime')
            .then(res => {
                if (res.status === 401) {
                    alert("로그인이 필요합니다.");
                    location.href = "/api/login"; // 로그인 페이지 주소 확인
                    return;
                }
                return res.json();
            })
            .then(data => {
                if (!data) return;

                const now = new Date();
                // "HH:mm" 형식 추출 (예: 11:30)
                const currentTime = now.getHours().toString().padStart(2, '0') + ":" +
                    now.getMinutes().toString().padStart(2, '0');

                const start = data.startTime; // DB의 "09:00"
                const end = data.endTime;     // DB의 "18:00"

                // 2. 시간 비교 로직
                if (currentTime < start || currentTime > end) {
                    alert("현재는 근무시간이 아닙니다. (근무시간: " + start + " ~ " + end + ")");
                    // 3. 새로고침을 원하면 아래 주석 해제
                    // location.reload();
                    return; // 함수 종료 (이동 안 함)
                }

                // ✅ 4. 근무시간이면 '데이터'가 아닌 '화면'을 주는 주소로 이동!
                window.location.href = "/room_list";
            })
            .catch(err => {
                console.error(err);
                alert("서버 통신 중 오류가 발생했습니다.");
            });
    });
</script>
</body>
</html>
