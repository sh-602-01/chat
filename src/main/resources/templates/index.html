<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>채팅보정서비스</title>
    <link href="/css/common.css" rel="stylesheet">
    <link href="/css/index.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="center-card">
        <div class="logo-area">
            <img src="/images/malrang.png" class="simbol_img" alt="말랑로고">
        </div>
        <button class="start-btn" onclick="goToLogin()">내 스타일로 시작하기</button>
        <p class="exp">이전 대화와 내 말투를 기억해 <br> 나에게 딱 맞는 맞춤형 보정을 제공합니다.</p>
        <button class="start-guest-btn" onclick="openModal()">체험 먼저 해보기</button>
        <p class="exp">가입 없이 지금 즉시 보정서비스를 체험해 보세요.</p>

        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-card">
                <div class="modal-info">원하는 보정 키워드를 <br> 입력해 주세요.</div>
                <div class="text-display" id="tagDisplay">
                    <span>키워드를 입력한 후 띄어쓰기 해주세요.<br> 최대 5개 키워드</span>
                </div>

                <div class="tag-input-wrapper">
                    <input type="text" id="tagInputField" placeholder="예) 단호함, 부드럽게" onkeypress="handleTagInput(event)">
                </div>

                <div class="btn-wrap">
                    <button class="action-btn btn-outline" onclick="skipWithDefault()">이대로 두기</button>
                    <button class="action-btn btn-solid" onclick="saveAndContinue()">스타일 적용하기</button>
                </div>
            </div>
        </div>
    </div>


</div>
</body>
<script>
    function goToLogin() {
        window.location.href = '/api/login'; // 로그인 페이지 경로
    }

    const modal = document.getElementById('modalOverlay');
    const tagDisplay = document.getElementById('tagDisplay');
    const tagInputField = document.getElementById('tagInputField');
    let selectedTags = [];

    function openModal() {
        modal.style.display = 'flex';
        tagInputField.focus();
    }

    function closeModal() {
        modal.style.display = 'none';
    }

    function handleTagInput(event) {
        if (event.key === ' ' || event.code === 'Space') {
            event.preventDefault(); // 스페이스 입력 막기

            const value = tagInputField.value.trim();

            if (value && !selectedTags.includes(value)) {
                if (selectedTags.length >= 5) {
                    alert("태그는 최대 5개까지 입력 가능합니다.");
                    return;
                }
                selectedTags.push(value);
                renderTags();
            }

            tagInputField.value = '';
        }
    }

    function renderTags() {
        if (selectedTags.length === 0) {
            tagDisplay.innerHTML = '<span style="color: #AAA; font-size: 12px; width:100%; text-align:center; margin-top:20px;">키워드를 입력해 주세요</span>';
            return;
        }
        tagDisplay.innerHTML = '';
        selectedTags.forEach((tag, index) => {
            const tagEl = document.createElement('div');
            tagEl.id = 'tag' + (index + 1);
            tagEl.className = 'tag-item';
            tagEl.innerText = '#'+ tag;
            tagEl.onclick = () => {
                selectedTags.splice(index, 1);
                renderTags();
            };
            tagDisplay.appendChild(tagEl);
        });
    }

    function saveAndContinue() {
        if (selectedTags.length === 0) {
            alert("최소 한 개의 키워드를 입력해 주세요.");
            return;
        }
        // const tags = [
        //     tag1.value, tag2.value, tag3.value, tag4.value, tag5.value
        // ].filter(v => v);
        localStorage.setItem("hashtags", JSON.stringify(selectedTags));
        location.href = "/room_list";
        closeModal();
    }
    function skipWithDefault() {
        // 👉 기본 키워드 세팅
        const defaultTag = ["기본설정"];

        localStorage.setItem("hashtags", JSON.stringify(defaultTag));

        location.href = "/room_list";
    }
</script>
</html>
