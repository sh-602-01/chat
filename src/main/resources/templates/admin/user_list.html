<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 - 유저 목록</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/admin.css" rel="stylesheet">
</head>
<body>
<!-- header -->
<th:block th:insert="admin/fragments/header :: header"></th:block>
<div class="layout">
    <!-- sidebar   -->
    <th:block th:insert="admin/fragments/sidebar:: sidebar"></th:block>
    <div class="content">
        <h2 class="mb-4">유저 관리</h2>
        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>아이디</th>
                    <th>이름</th>
                    <th>근무시간</th>
                    <th>관리</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}" th:id="'user-row-' + ${user.id}">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.userId}"></td>
                    <td th:text="${user.userName}"></td>
                    <td>
                        <span th:text="${user.workStartTime}"></span> ~
                        <span th:text="${user.workEndTime}"></span>
                    </td>
                    <td>
                        <button class="btn btn-sm btn-danger" th:onclick="'deleteUser(' + ${user.id} + ')'">삭제</button>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="5">등록된 유저가 없습니다.</td>
                </tr>
                </tbody>
            </table>
            <nav class="pagination" th:if="${totalPages > 0}">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${chatPage.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/chat/list(page=${chatPage.number - 1})}">&laquo;</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" th:href="@{/admin/chat/list(page=${i})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${chatPage.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/chat/list(page=${chatPage.number + 1})}">&raquo;</a>
                    </li>
                </ul>
            </nav>
        </div>
        <div class="text-end mt-3 d-flex justify-content-between">
            <a href="/admin/users" class="btn btn-sm btn-secondary">홈으로</a>
            <a class="btn btn-sm btn-primary" th:href="@{/admin/users/save}">신규 유저 등록</a>
        </div>
    </div>
</div>
<script>
    function deleteUser(id) {
        if (confirm("정말 이 유저를 삭제하시겠습니까?")) {
            $.ajax({
                url: '/admin/users/' + id,
                type: 'DELETE',
                success: function (result) {
                    if (result === "ok") {
                        alert("삭제되었습니다.");
                        $("#user-row-" + id).remove();
                    }
                },
                error: function () {
                    alert("삭제 실패!");
                }
            });
        }
    }
</script>
<script>
    // 현재 페이지의 path
    const currentPath = window.location.pathname;

    // 모든 사이드바 메뉴 가져오기
    const menuLinks = document.querySelectorAll('.sidebar .menu');

    menuLinks.forEach(link => {
        // 링크의 href가 현재 경로와 일치하면 active 클래스 추가
        if (currentPath === link.getAttribute('href') ||
            currentPath.startsWith(link.getAttribute('href'))) {
            link.classList.add('active');
        }
    });
</script>
</body>
</html>
