<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 - 채팅 로그 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/admin.css" rel="stylesheet">
</head>
<body>
<!-- header -->
<th:block th:insert="admin/fragments/header :: header"></th:block>
<div class="layout">
    <!-- sidebar   -->
    <th:block  th:insert="admin/fragments/sidebar :: sidebar"></th:block>
    <div class="content">
        <h2 class="mb-4">채팅 로그 관리 <span class="badge bg-primary" th:text="'전체 메시지: ' + ${chatPage.totalElements}"></span></h2>
        <div class="table-container">
            <table>
                <colgroup>
                    <col style="width:5%">
                    <col style="width:5%">
                    <col style="width:8%">
                    <col>
                    <col>
                    <col style="width:10%">
                    <col style="width:5%">
                </colgroup>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>방번호</th>
                    <th>작성자</th>
                    <th>원본</th>
                    <th>변환</th>
                    <th>시간</th>
                    <th>관리</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="msg : ${chatPage.content}">
                    <td th:text="${msg.msgId}"></td>
                    <td th:text="${msg.roomId}"></td>
                    <td th:text="${msg.senderId}"></td>
                    <td class="msg-text td_left" th:text="${msg.originalMsg}" th:title="${msg.originalMsg}">
                    </td>
                    <td class="msg-text td_left" th:text="${msg.finalMsg}" th:title="${msg.finalMsg}"></td>
                    <td th:text="${#temporals.format(msg.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                    <td>
                        <form th:action="@{/admin/chat/delete/{id}(id=${msg.msgId})}" method="post"
                              onsubmit="return confirm('이 메시지를 정말 삭제하시겠습니까?');">
                            <button type="submit" class="btn btn-danger btn-sm">삭제</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <nav class="pagination" th:if="${totalPages > 0}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${chatPage.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/chat/list(page=${chatPage.number - 1})}">&laquo;</a>
                </li>

                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/admin/chat/list(page=${i})}" th:text="${i + 1}">1</a>
                </li>

                <li class="page-item" th:classappend="${chatPage.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/chat/list(page=${chatPage.number + 1})}">&raquo;</a>
                </li>
            </ul>
        </nav>
        <div class="mt-3 text-end">
            <a href="/admin/users" class="btn btn-sm btn-secondary">홈으로</a>
        </div>
    </div>
</div>
<script>
    // 현재 페이지의 path
    const currentPath = window.location.pathname;

    // 모든 사이드바 메뉴 가져오기
    const menuLinks = document.querySelectorAll('.sidebar .menu');

    menuLinks.forEach(link => {
        // 링크의 href가 현재 경로와 일치하면 active 클래스 추가
        if (currentPath === link.getAttribute('href') ||
            currentPath.startsWith(link.getAttribute('href'))) {
            link.classList.add('active');
        }
    });
</script>
</body>

</html>
