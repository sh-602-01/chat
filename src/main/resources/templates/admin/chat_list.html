<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>관리자 - 채팅 로그 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/admin.css" rel="stylesheet">
    <style>
        .table th,
        .table td {
            vertical-align: middle;
        }

        .table td.td_left {
            text-align: left;
        }

        .msg-content {
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <div class="header">말랑말랑 관리자 <small>Admin Dashboard</small>
    </div>
    <div class="layout">
        <div class="sidebar">
            <div class="menu">사용자 관리</div>
            <div class="menu active">채팅 로그 관리</div>
        </div>
        <div class="content">
            <span style="margin-bottom:15px" class="badge bg-primary" th:text="'전체 메시지: ' + ${chatPage.totalElements}"></span>
            <div class="table-container">
                <table>
                    <colgroup>
                        <col style="width:5%">
                        <col style="width:5%">
                        <col style="width:8%">
                        <col>
                        <col>
                        <col style="width:10%">
                        <col style="width:5%">
                    </colgroup>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>방번호</th>
                            <th>작성자</th>
                            <th>원본</th>
                            <th>변환</th>
                            <th>시간</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="msg : ${chatPage.content}">
                            <td th:text="${msg.msgId}"></td>
                            <td th:text="${msg.roomId}"></td>
                            <td th:text="${msg.senderId}"></td>
                            <td class="msg-text td_left" th:text="${msg.originalMsg}" th:title="${msg.originalMsg}">
                            </td>
                            <td class="msg-text td_left" th:text="${msg.finalMsg}" th:title="${msg.finalMsg}"></td>
                            <td th:text="${#temporals.format(msg.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                            <td>
                                <form th:action="@{/admin/chat/delete/{id}(id=${msg.msgId})}" method="post"
                                    onsubmit="return confirm('이 메시지를 정말 삭제하시겠습니까?');">
                                    <button type="submit" class="btn btn-danger btn-sm">삭제</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <nav class="pagination" th:if="${totalPages > 0}">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${chatPage.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/chat/list(page=${chatPage.number - 1})}">&laquo;</a>
                    </li>

                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" th:href="@{/admin/chat/list(page=${i})}" th:text="${i + 1}">1</a>
                    </li>

                    <li class="page-item" th:classappend="${chatPage.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/chat/list(page=${chatPage.number + 1})}">&raquo;</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>



    <div class="mt-3 text-end">
        <a href="/" class="btn btn-secondary">홈으로</a>
    </div>

</body>

</html>
