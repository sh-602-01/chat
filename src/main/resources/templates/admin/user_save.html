<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 - 유저 목록</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/admin.css" rel="stylesheet">
</head>
<body>
<!-- header -->
<th:block th:insert="admin/fragments/header :: header"></th:block>

<div class="layout">
    <!-- sidebar -->
    <th:block th:insert="admin/fragments/sidebar :: sidebar"></th:block>

    <div class="content flex-grow-1 p-4">
        <h2 class="mb-4">유저 등록</h2>

        <form action="/admin/users/save" method="post" class="row g-3">

            <div class="col-md-2">
                <label for="userId" class="form-label">아이디</label>
                <input type="text" id="userId" name="userId" class="form-control" required>
            </div>

            <div class="col-md-2">
                <label for="password" class="form-label">비밀번호</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>

            <div class="col-md-2">
                <label for="userName" class="form-label">이름</label>
                <input type="text" id="userName" name="userName" class="form-control" required>
            </div>

            <div class="col-md-2">
                <label for="workStartTime" class="form-label">출근시간</label>
                <input type="time" id="workStartTime" name="workStartTime" class="form-control">
            </div>

            <div class="col-md-2">
                <label for="workEndTime" class="form-label">퇴근시간</label>
                <input type="time" id="workEndTime" name="workEndTime" class="form-control">
            </div>

            <div class="col-12 mt-3">
                <button type="submit" class="btn btn-sm btn-primary me-2">등록하기</button>
                <button type="button" class="btn btn-sm btn-secondary" onclick="location.href='/admin/users'">취소(목록으로)</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
